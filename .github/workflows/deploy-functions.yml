name: Build & Deploy Firebase Functions

# Manual deploy of the five prod Cloud Functions to project mcoe-d:
# mintGithubToken, getInstallation, githubWebhook, getAnalyticsSummary,
# recordPreview. Triggered from the Actions tab via workflow_dispatch
# — no auto-deploy on push (intentional, matching deploy-platform.yml).
#
# Reuses `pnpm --filter @nebula-docs/functions deploy:prod` so the CI
# command matches the local manual command exactly. The pnpm script in
# functions/package.json is the single source of truth for which
# functions get deployed.
#
# Secrets used by individual functions (GITHUB_APP_PRIVATE_KEY, etc.)
# are set out-of-band via `firebase functions:secrets:set --data-file=`
# and are not part of this workflow.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: uhg-runner

    env:
      PNPM_VERSION: 10.33.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JFrog SaaS Connection
        id: jf-saas-setup
        uses: uhg-pipelines/epl-jf/configure-saas-connection@v4
        with:
          jfrog-url: https://centraluhg.jfrog.io
          jfrog-edge-url: https://centraluhg.jfrog.io
          jfrog-project-key: glb
          npm-setup: true

      - name: Fix pnpm auth for JFrog virtual repos
        run: |
          TOKEN=$(grep 'glb-npm-vir/:_authToken=' ~/.npmrc | sed 's/.*_authToken=//')
          echo "//centraluhg.jfrog.io/:_authToken=${TOKEN}" >> ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Functions
        run: pnpm --filter @nebula-docs/functions build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MCOE_D }}' > "${{ runner.temp }}/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy prod functions
        run: pnpm --filter @nebula-docs/functions deploy:prod
