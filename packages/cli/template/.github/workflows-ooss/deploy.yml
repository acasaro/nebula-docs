name: Deploy docs

# Deploys the docs site:
#   - push to main → build with no base → upload to bucket root
#   - pull_request   → build with --base /previews/<PR#>/ → upload to
#                      bucket sub-path. The Nebula Cloud Function
#                      githubWebhook listens for `workflow_run` events with
#                      a non-empty `pull_requests[]`, reads `deploy.bucketBaseUrl`
#                      from this repo's docs.json, and writes
#                      `previewUrl: ${bucketBaseUrl}/previews/<PR#>/` onto
#                      the matching builds/{run_id} doc the dashboard reads.
#
# Companion workflow `cleanup-preview.yml` removes the sub-path when a PR
# is closed.
#
# Bucket auth: this template uses UHG's standard secret-vault + ooss-deploy
# action chain (the same one MCOE uses today). Tenants on different infra
# replace the "Get OOSS Credentials" + "Deploy to OOSS root" / "sub-path"
# steps with whatever their hosting target requires; the build step itself
# is identical regardless.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

# Cancel any in-flight build for the same branch / PR — only the latest
# commit's preview is meaningful, and per-PR builds + uploads aren't free.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: uhg-runner
    env:
      # Tenants set this to their OOSS bucket name. Pair with
      # `deploy.bucketBaseUrl` in docs.json (which surfaces the public URL
      # of the same bucket to the dashboard).
      OOSS_BUCKET_NAME: REPLACE_ME_BUCKET_NAME
      PNPM_VERSION: 10.33.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JFrog SaaS Connection
        uses: uhg-pipelines/epl-jf/configure-saas-connection@v4
        with:
          jfrog-url: https://centraluhg.jfrog.io
          jfrog-edge-url: https://centraluhg.jfrog.io
          jfrog-project-key: glb
          npm-setup: true

      - name: Fix pnpm auth for JFrog virtual repos
        run: |
          TOKEN=$(grep 'glb-npm-vir/:_authToken=' ~/.npmrc | sed 's/.*_authToken=//')
          echo "//centraluhg.jfrog.io/:_authToken=${TOKEN}" >> ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compute the build base + bucket destination from the trigger.
      # Outputs:
      #   base — passed to `nebula build --base`. Empty for main pushes.
      #   bucket-path — sub-path under the bucket. Empty for main pushes.
      #   pr-number — convenience for downstream uses.
      - name: Compute deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
            echo "base=/previews/${PR}" >> "$GITHUB_OUTPUT"
            echo "bucket-path=previews/${PR}" >> "$GITHUB_OUTPUT"
            echo "pr-number=${PR}" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "bucket-path=" >> "$GITHUB_OUTPUT"
            echo "pr-number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          if [ -n "${{ steps.target.outputs.base }}" ]; then
            pnpm nebula build --base "${{ steps.target.outputs.base }}"
          else
            pnpm nebula build
          fi

      - name: Get OOSS Credentials
        uses: uhg-pipelines/immerse-actions/vaults/get-secrets@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          required-secrets: '["OOSS_AWS_ACCESS_KEY_ID", "OOSS_AWS_SECRET_ACCESS_KEY"]'
          environment: dev

      # main → bucket root, with sync-delete so removed pages disappear.
      - name: Deploy to OOSS root
        if: github.event_name != 'pull_request'
        uses: uhg-pipelines/cd-workflows/actions/ooss-deploy@v1.1.2
        with:
          OOSS_AWS_ACCESS_KEY_ID: ${{ env.OOSS_AWS_ACCESS_KEY_ID }}
          OOSS_AWS_SECRET_ACCESS_KEY: ${{ env.OOSS_AWS_SECRET_ACCESS_KEY }}
          build-directory: dist
          ooss-custom-bucket-name: ${{ env.OOSS_BUCKET_NAME }}
          enable-sync-delete: true

      # pull_request → bucket sub-path. ooss-deploy@v1 doesn't accept a
      # destination prefix, so use the aws CLI directly. `--delete` only
      # affects keys under the previews/<PR>/ prefix, which is what we
      # want — main's bucket root is unaffected.
      - name: Deploy preview to OOSS sub-path
        if: github.event_name == 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ env.OOSS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.OOSS_AWS_SECRET_ACCESS_KEY }}
          BUCKET_PATH: ${{ steps.target.outputs.bucket-path }}
        run: |
          aws s3 sync ./dist "s3://${OOSS_BUCKET_NAME}/${BUCKET_PATH}/" \
            --delete \
            --no-progress
