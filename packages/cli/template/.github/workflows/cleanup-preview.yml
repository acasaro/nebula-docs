name: Cleanup preview

# Removes the per-PR preview sub-tree from the bucket when a PR closes.
# Triggered for both merged and discarded PRs — the preview is gone in
# either case. Idempotent: deleting an already-deleted prefix is a no-op.
#
# Companion workflow `deploy.yml` creates the sub-tree on PR open / sync.

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: cleanup-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: uhg-runner
    env:
      OOSS_BUCKET_NAME: REPLACE_ME_BUCKET_NAME

    steps:
      - name: Get OOSS Credentials
        uses: uhg-pipelines/immerse-actions/vaults/get-secrets@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          required-secrets: '["OOSS_AWS_ACCESS_KEY_ID", "OOSS_AWS_SECRET_ACCESS_KEY"]'
          environment: dev

      - name: Delete preview sub-path
        env:
          AWS_ACCESS_KEY_ID: ${{ env.OOSS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.OOSS_AWS_SECRET_ACCESS_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          aws s3 rm "s3://${OOSS_BUCKET_NAME}/previews/${PR}/" \
            --recursive \
            --only-show-errors
