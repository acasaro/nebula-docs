name: Cleanup preview

# Deletes the per-PR Firebase Hosting Preview Channel when a PR closes
# (merged or discarded). Channels expire automatically after their configured
# TTL (default 7d), but cleaning up explicitly keeps the channel list tidy
# and frees the quota slot immediately.
#
# Companion workflow `deploy.yml` creates the channel on PR open / sync.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: cleanup-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$FIREBASE_SERVICE_ACCOUNT_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$FIREBASE_SERVICE_ACCOUNT_PATH" >> "$GITHUB_ENV"

      # `hosting:channel:delete` is idempotent — deleting an unknown channel
      # exits non-zero with "channel not found". `|| true` swallows that so
      # closing an already-cleaned-up PR doesn't fail the workflow.
      - name: Delete preview channel
        run: |
          firebase hosting:channel:delete \
            "pr-${{ github.event.pull_request.number }}" \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --force \
            || true
