name: Cleanup preview channel

# Deletes the Firebase Hosting Preview Channel for a branch the moment
# the branch is removed from GitHub (auto-merge cleanup, manual delete,
# etc.). Without this, channels stick around until their 7-day TTL —
# wasteful and clutters the Firebase Console.
#
# Setup:
#   - Replace REPLACE_ME_SITE_NAME with your hosting site name (the same
#     one in firebase.json's `hosting.target`-resolved site).
#   - Same FIREBASE_SERVICE_ACCOUNT secret + FIREBASE_PROJECT_ID variable
#     deploy.yml uses.

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to clean up the channel for (manual run)"
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    # Only trigger for branch deletions — `delete` also fires on tags.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest

    steps:
      # Need firebase.json in cwd; firebase CLI's `hosting:channel:delete`
      # bails with "Not in a Firebase app directory" otherwise. Checkout
      # main explicitly since the deleted branch (default checkout target)
      # no longer exists.
      - name: Checkout tenant (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MCOE_D }}' > "$FIREBASE_SERVICE_ACCOUNT_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$FIREBASE_SERVICE_ACCOUNT_PATH" >> "$GITHUB_ENV"

      # Same sanitization as deploy.yml so the channel ID matches.
      - name: Compute channel ID
        id: channel
        env:
          REF_NAME: ${{ github.event.inputs.branch || github.event.ref }}
        run: |
          SANITIZED=$(echo "$REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]/-/g; s/-+/-/g; s/^-+//; s/-+$//' \
            | cut -c -56)
          echo "id=branch-${SANITIZED}" >> "$GITHUB_OUTPUT"

      # Delete the channel. If it's already gone treat that as success;
      # surface anything else as a real failure so we don't get silent
      # green runs while the channel sits untouched.
      - name: Delete preview channel
        env:
          CHANNEL_ID: ${{ steps.channel.outputs.id }}
        run: |
          set +e
          out=$(firebase hosting:channel:delete "$CHANNEL_ID" \
            --site REPLACE_ME_SITE_NAME \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --force 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if echo "$out" | grep -qiE "could not find|does not exist|not found"; then
            echo "Channel '$CHANNEL_ID' already deleted — treating as success."
            exit 0
          fi
          echo "::error::firebase hosting:channel:delete failed for '$CHANNEL_ID'"
          exit "$status"
