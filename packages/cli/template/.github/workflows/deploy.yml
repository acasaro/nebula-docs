name: Deploy docs

# Default tenant deploy workflow — Firebase Hosting + Preview Channels.
#
# - push to main           → build → deploy to the primary site (live).
# - pull_request           → build → deploy to a per-PR Preview Channel
#                            (`pr-<PR#>`) → POST the channel URL to the
#                            recordPreview Cloud Function so it lands on
#                            `builds/{run_id}.previewUrl` and the dashboard
#                            Preview button lights up.
#
# Companion workflow `cleanup-preview.yml` deletes the channel when a PR
# closes so quota isn't wasted on stale previews.
#
# This is the recommended path. If your tenant deploys to a UHG OOSS bucket
# (or any "fixed host + sub-path" target), copy `../workflows-ooss/*.yml`
# into this directory instead and set `deploy.bucketBaseUrl` in your
# `docs.json`.
#
# Required secrets (GitHub Actions repo secrets):
#   FIREBASE_SERVICE_ACCOUNT          JSON of a Firebase Hosting deploy service
#                                     account on your Firebase project.
#   NEBULA_RECORD_PREVIEW_SECRET      Shared secret matching the Cloud Function's
#                                     RECORD_PREVIEW_SECRET (or DEV_RECORD_PREVIEW_SECRET
#                                     for dev). Use the dev one against the dev
#                                     Function URL while iterating.
#
# Required variables (GitHub Actions repo variables):
#   FIREBASE_PROJECT_ID               e.g. mcoe-d
#   NEBULA_RECORD_PREVIEW_URL         The deployed function endpoint, e.g.
#                                     https://recordpreviewdev-…-uc.a.run.app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write       # FirebaseExtended/action-hosting-deploy comments on PRs
  checks: write

# Cancel any in-flight build for the same branch / PR — only the latest
# commit's preview is meaningful.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Tenant repo uses npm (the framework monorepo's `file:` link doesn't
      # play nicely with pnpm). When this template ships in `nebula init`
      # we'll generate the right install command per consumer.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # main → live; PR → preview channel `pr-<PR#>`. The action handles
      # both modes via the `channelId` input: provide it for PRs, leave
      # blank for live deploys.
      - name: Deploy
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
          # Default 7d channel expiry is fine for review cycles. Bump if
          # PRs routinely sit longer.
          expires: 7d

      # Send the channel URL back to recordPreview so the dashboard can
      # surface the Preview button. Skipped on `push` (live deploys don't
      # populate previewUrl — that field is for PR previews only).
      - name: Notify recordPreview
        if: github.event_name == 'pull_request' && steps.deploy.outputs.details_url != ''
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          ENDPOINT: ${{ vars.NEBULA_RECORD_PREVIEW_URL }}
          SECRET: ${{ secrets.NEBULA_RECORD_PREVIEW_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --argjson runId "$RUN_ID" \
                  --argjson prNumber "$PR_NUMBER" \
                  --arg previewUrl "$PREVIEW_URL" \
                  --arg repoFullName "$REPO_FULL_NAME" \
                  '{runId: $runId, prNumber: $prNumber, previewUrl: $previewUrl, repoFullName: $repoFullName}')"
